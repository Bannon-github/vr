name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  orb-collector:
    name: Orb Collector tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: imports/Me-google/platform/quest/game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: imports/Me-google/platform/quest/game/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
